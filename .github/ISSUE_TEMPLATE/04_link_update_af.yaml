name: Update AF Links
description: Submit a new copy of AF Links from the portal
title: "[Update AF Links]"
labels: ["update af links", "workflow"]
assignees:
  - dadatuputi
body:
  - type: markdown
    attributes:
      value: |
        The portal keeps its links on several pages (Applications A-Z and the Home, Career and Training, and Life and Fitness quick-link lists). `getlinks.js` fetches all of them from any portal page and submits them together. Links no list carries any more are kept, muted, and retired after 180 days.

        1. Open any page of the [AF Portal](https://www.my.af.mil/) while logged in.
        1. Open developer tools (F12) and select the `Console` tab
        1. Paste the contents of [`getlinks.js`](https://raw.githubusercontent.com/dadatuputi/aflink/refs/heads/master/getlinks.js) into the console command line and hit return.
        1. Normally the script submits the links itself and shows "Links submitted" with a count per list; a pull request then appears for review, and no issue is needed. Only if it shows the compressed-data box instead: copy the box and paste it into the field below.
        1. When the issue is closed/approved, it will be rolled in and built using GitHub actions.
  - type: input
    id: b64json
    attributes:
      label: Compressed JSON
      description: A base64 encoded zlib compressed JSON list of links from the AF Portal
      placeholder: |
        d1wEG+DYYYu1Pi5xr3Oq40...
    validations:
      required: true  
