name: Add a Link
description: Submit a request to add a link
title: "[LINK]: "
labels: ["add link", "workflow"]
assignees:
  - dadatuputi
body:
  - type: input
    id: title
    attributes:
      label: Link Title
      description: A short, descriptive title for the link
      placeholder: e.g., AF Portal
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link URL
      description: The complete link URL
      placeholder: e.g., https://www.my.af.mil
    validations:
      required: true
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One line of 90 characters or fewer saying what the link is for. It is shown under the title and searched.
      placeholder: e.g., Pay statements, W-2s and allotments
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: Description
      description: Optional. A sentence or two more, shown when someone opens the link's details. One line.
    validations:
      required: false
  - type: dropdown
    id: link_type
    attributes:
      label: Link Type
      description: Official is a government (.mil / .gov) resource. Unofficial is a third-party tool or guide, shown in the separate Unofficial section.
      options:
        - Official
        - Unofficial
    validations:
      required: true
  - type: textarea
    id: comment
    attributes:
      label: Comment
      description: A comment about the link and a reason why it should be added.
    validations:
      required: true
