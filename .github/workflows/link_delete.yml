name: Link Delete from Issue

# Issue text never reaches a shell or a script template: fields are read by
# scripts/issue-fields.js into environment variables, and every step uses
# them as $VAR (or process.env in github-script), never as ${{ }}.
on:
  repository_dispatch:
    types: [link_delete]

jobs:
  delete_link:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Read the issue form
      env:
        BODY: ${{ github.event.client_payload.issue_body }}
      run: |
        echo "Original issue: ${{ github.event.client_payload.original_issue }}"
        node scripts/issue-fields.js LINK_ID="Link ID"

    - name: Validate
      run: |
        if [ -z "$LINK_ID" ]; then
          echo "Error: LINK_ID not found in issue body"
          exit 1
        fi

    - name: Install jq & sponge
      run: |
        # Skip installing package docs (makes the man-db trigger much faster)
        sudo tee /etc/dpkg/dpkg.cfg.d/01_nodoc > /dev/null << 'EOF'
        path-exclude /usr/share/doc/*
        path-exclude /usr/share/man/*
        path-exclude /usr/share/info/*
        EOF

        sudo apt-get update
        sudo apt-get install --yes jq moreutils

    - name: Search link lists for Link ID
      run: |
        echo "Searching for LINK_ID: $LINK_ID"

        # Check links_other.json first (this is the file we normally remove from)
        if jq -e --arg id "$LINK_ID" '.OTHER[]? | select(.contentId == $id)' src/links/links_other.json >/dev/null 2>&1; then
          echo "ACTION=remove" >> $GITHUB_ENV
          echo "TARGET_FILE=src/links/links_other.json" >> $GITHUB_ENV
          echo "TARGET_KEY=OTHER" >> $GITHUB_ENV
          echo "Found LINK_ID in src/links/links_other.json; will remove."

        # If not there, check links_af.json (AF categorized links): an override hides it instead
        elif jq -e --arg id "$LINK_ID" '.afpCategorizedLinksDto.links[]? | .[]? | select(.contentId == $id)' src/links/links_af.json >/dev/null 2>&1; then
          echo "ACTION=override" >> $GITHUB_ENV
          echo "Found LINK_ID in src/links/links_af.json; will create override entry."

        # Last, check links_unofficial.json, removed directly like OTHER
        elif jq -e --arg id "$LINK_ID" '.UNOFFICIAL[]? | select(.contentId == $id)' src/links/links_unofficial.json >/dev/null 2>&1; then
          echo "ACTION=remove" >> $GITHUB_ENV
          echo "TARGET_FILE=src/links/links_unofficial.json" >> $GITHUB_ENV
          echo "TARGET_KEY=UNOFFICIAL" >> $GITHUB_ENV
          echo "Found LINK_ID in src/links/links_unofficial.json; will remove."

        else
          echo "Error: LINK_ID '$LINK_ID' not found in links_other.json, links_af.json, or links_unofficial.json"
          exit 1
        fi

    - name: Remove link from its list
      if: env.ACTION == 'remove'
      run: |
        BEFORE_COUNT=$(jq --arg KEY "$TARGET_KEY" '.[$KEY] | length' "$TARGET_FILE")

        jq -r --arg LINK_ID "$LINK_ID" --arg KEY "$TARGET_KEY" '.[$KEY] |= map(select(.contentId != $LINK_ID))' "$TARGET_FILE" | sponge "$TARGET_FILE"

        AFTER_COUNT=$(jq --arg KEY "$TARGET_KEY" '.[$KEY] | length' "$TARGET_FILE")

        if [ "$BEFORE_COUNT" -eq "$AFTER_COUNT" ]; then
          echo "Warning: No items were removed. LINK_ID '$LINK_ID' may not exist."
          exit 1
        else
          echo "Successfully removed 1 item. Count: $BEFORE_COUNT -> $AFTER_COUNT"
        fi

        # Its summary and description go with it
        jq --arg ID "$LINK_ID" 'del(.descriptions[$ID])' src/links/links_descriptions.json | sponge src/links/links_descriptions.json

        cat "$TARGET_FILE"

    - name: Add override entry for links_af.json
      if: env.ACTION == 'override'
      run: |
        set -o pipefail
        OVERRIDE_ID=$(uuidgen)

        # Create override entry with title and link set to null to hide the AF Portal link
        jq --arg LINK_ID "$LINK_ID" \
           --arg OVERRIDE_ID "$OVERRIDE_ID" \
           '. += [{
             "id": $OVERRIDE_ID,
             "match_method": "Content ID",
             "match": $LINK_ID,
             "title": null,
             "link": null,
             "timestamp": now
           }]' src/links/links_override.json | sponge src/links/links_override.json

        echo "✅ Added override entry for LINK_ID '$LINK_ID' (override id: $OVERRIDE_ID)"

    - name: Add failure comment
      if: failure()
      uses: actions/github-script@v9
      env:
        LINK_ID: ${{ env.LINK_ID }}
      with:
        script: |
          await github.rest.issues.createComment({
            issue_number: context.payload.client_payload.original_issue,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '❌ Failed to remove link with Content ID `' + process.env.LINK_ID + '` - it may not exist in the list.'
          })

    - name: Commit New Changes
      uses: EndBug/add-and-commit@v10
      with:
        message: "Deleted link from issue ${{ github.event.client_payload.original_issue }}"

    - name: Trigger next workflow
      uses: actions/github-script@v9
      with:
        script: |
          await github.rest.repos.createDispatchEvent({
            owner: context.repo.owner,
            repo: context.repo.repo,
            event_type: 'build',
            client_payload: {
              commit_sha: context.sha,
              message: 'Updated links from Issue'
            }
          });

    - name: Add success comment
      uses: actions/github-script@v9
      with:
        script: |
          await github.rest.issues.createComment({
            issue_number: context.payload.client_payload.original_issue,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ **Link deleted successfully!**\n\nThe link has been deleted and will be removed on the next site deployment.'
          })
