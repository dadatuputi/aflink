# Publishes server.json to the MCP Registry (https://registry.modelcontextprotocol.io)
# as us.aflink/search. Run by hand, after Cloudflare Workers Builds
# has deployed the worker carrying the /mcp endpoint (it deploys on pushes to
# master that touch search_worker/): the Registry lists the remote URL as given,
# so this checks that the URL really answers before publishing.
#
# Authentication is HTTP domain proof: https://aflink.us/.well-known/mcp-registry-auth
# (src/.well-known/ in this repo) carries the public key, and the job signs with
# the matching Ed25519 private key, which proves control of aflink.us and so of
# the us.aflink/* namespace. The private key is the MCP_REGISTRY_KEY secret of
# the mcp-registry-publish environment; restrict that environment to master,
# since the key can publish any us.aflink/* server. Publishing a version already in the
# Registry fails, so bump "version" in server.json (and SERVER_VERSION in
# search_worker/src/mcp.js) for each new listing.
name: Publish MCP server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to the MCP Registry
    runs-on: ubuntu-latest
    # Holds MCP_REGISTRY_KEY; deployment branches limited to master
    environment: mcp-registry-publish
    permissions:
      contents: read
    env:
      # Pinned deliberately and verified below; bump on purpose, not to "latest"
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test the MCP endpoint and server.json
        run: |
          node search_worker/build-links.js
          node --test test/mcp-server.test.js

      - name: Check the deployed endpoint answers
        run: |
          set -euo pipefail
          url="$(jq -r '.remotes[0].url' server.json)"
          name="$(jq -r '.name' server.json)"
          version="$(jq -r '.version' server.json)"
          reply="$(curl --fail --silent --show-error -X POST "$url" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"aflink-publish-check","version":"1"}}}')"
          echo "$reply" | jq .
          [ "$(echo "$reply" | jq -r '.result.serverInfo.name')" = "$name" ] \
            || { echo "::error::$url does not answer as $name; wait for the worker build to deploy first"; exit 1; }
          [ "$(echo "$reply" | jq -r '.result.serverInfo.version')" = "$version" ] \
            || { echo "::error::$url is not serving version $version; wait for the worker build to deploy first"; exit 1; }

      - name: Check aflink.us serves the public key
        run: |
          set -euo pipefail
          served="$(curl --fail --silent --show-error https://aflink.us/.well-known/mcp-registry-auth)"
          [ "$served" = "$(cat src/.well-known/mcp-registry-auth)" ] \
            || { echo "::error::aflink.us/.well-known/mcp-registry-auth does not match src/.well-known/; wait for the Pages build"; exit 1; }

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Log in to the MCP Registry
        env:
          MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
        run: ./mcp-publisher login http --domain aflink.us --private-key "$MCP_REGISTRY_KEY"

      - name: Publish
        run: ./mcp-publisher publish

      - name: Show the listing
        run: |
          curl --fail --silent --show-error \
            "https://registry.modelcontextprotocol.io/v0/servers?search=$(jq -r '.name' server.json)" | jq .
