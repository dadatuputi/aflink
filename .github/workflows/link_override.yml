name: Link Override from Issue

# Issue text never reaches a shell or a script template: fields are read by
# scripts/issue-fields.js into environment variables, and every step uses
# them as $VAR (or process.env in github-script), never as ${{ }}.
on:
  repository_dispatch:
    types: [link_override]

jobs:
  override_link:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Read the issue form
      env:
        BODY: ${{ github.event.client_payload.issue_body }}
      run: |
        echo "Original issue: ${{ github.event.client_payload.original_issue }}"
        node scripts/issue-fields.js LINK_ID="Link ID" NEW_TITLE="New Link Title" NEW_LINK="New Link URL" NEW_SUMMARY="New Summary" CHANGE_TYPE="What are you updating?"

    - name: Validate
      run: |
        if [[ -z "$LINK_ID" ]]; then
          echo "VALIDATION_ERROR=Missing link id" >> $GITHUB_ENV
          exit 0
        fi
        # The selected change type dictates which new-value fields must be present;
        # a later step comments the error back on the issue and fails the job.
        if [[ "$CHANGE_TYPE" == *"Title"* && -z "$NEW_TITLE" ]]; then
          echo "VALIDATION_ERROR=the change type includes the title, but no New Link Title was provided" >> $GITHUB_ENV
        elif [[ "$CHANGE_TYPE" == *"URL"* && -z "$NEW_LINK" ]]; then
          echo "VALIDATION_ERROR=the change type includes the URL, but no New Link URL was provided" >> $GITHUB_ENV
        elif [[ "$CHANGE_TYPE" == "Summary" && -z "$NEW_SUMMARY" ]]; then
          echo "VALIDATION_ERROR=the change type is the summary, but no New Summary was provided" >> $GITHUB_ENV
        elif (( ${#NEW_SUMMARY} > 90 )); then
          echo "VALIDATION_ERROR=the New Summary is ${#NEW_SUMMARY} characters; keep it to 90 or fewer" >> $GITHUB_ENV
        elif [[ -z "$NEW_TITLE" && -z "$NEW_LINK" && -z "$NEW_SUMMARY" ]]; then
          echo "VALIDATION_ERROR=no New Link Title, New Link URL or New Summary was provided" >> $GITHUB_ENV
        fi

    - name: Install jq & sponge
      run: |
        # Skip installing package docs (makes the man-db trigger much faster)
        sudo tee /etc/dpkg/dpkg.cfg.d/01_nodoc > /dev/null << 'EOF'
        path-exclude /usr/share/doc/*
        path-exclude /usr/share/man/*
        path-exclude /usr/share/info/*
        EOF

        sudo apt-get update
        sudo apt-get install --yes jq moreutils uuid-runtime

    - name: Fail on validation error
      if: env.VALIDATION_ERROR != ''
      uses: actions/github-script@v9
      env:
        VALIDATION_ERROR: ${{ env.VALIDATION_ERROR }}
      with:
        script: |
          const error = process.env.VALIDATION_ERROR;
          await github.rest.issues.createComment({
            issue_number: context.payload.client_payload.original_issue,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '❌ Failed to add override: ' + error + '. Please edit the issue so the override can be created.'
          });
          throw new Error('Validation error: ' + error);

    - name: Determine target for override/update
      run: |
        echo "Searching for LINK_ID: $LINK_ID"

        # Look in links_other.json for a contentId match
        if jq -e --arg id "$LINK_ID" '.OTHER[]? | select(.contentId == $id)' src/links/links_other.json >/dev/null 2>&1; then
          echo "ACTION=edit_direct" >> $GITHUB_ENV
          echo "TARGET_FILE=src/links/links_other.json" >> $GITHUB_ENV
          echo "TARGET_KEY=OTHER" >> $GITHUB_ENV
          echo "Found in src/links/links_other.json; will update that file."

        # Else look in links_af.json for a contentId match
        elif jq -e --arg id "$LINK_ID" '.afpCategorizedLinksDto.links[]? | .[]? | select(.contentId == $id)' src/links/links_af.json >/dev/null 2>&1; then
          echo "ACTION=override" >> $GITHUB_ENV
          echo "Found in src/links/links_af.json; will add override entry."

        # Else look in links_unofficial.json for a contentId match
        elif jq -e --arg id "$LINK_ID" '.UNOFFICIAL[]? | select(.contentId == $id)' src/links/links_unofficial.json >/dev/null 2>&1; then
          echo "ACTION=edit_direct" >> $GITHUB_ENV
          echo "TARGET_FILE=src/links/links_unofficial.json" >> $GITHUB_ENV
          echo "TARGET_KEY=UNOFFICIAL" >> $GITHUB_ENV
          echo "Found in src/links/links_unofficial.json; will update that file."

        else
          echo "Error: LINK_ID '$LINK_ID' not found in links_other.json, links_af.json, or links_unofficial.json"
          exit 1
        fi

    - name: "Case: New summary (any link)"
      if: env.NEW_SUMMARY != ''
      run: |
        set -o pipefail
        # Summaries live in links_descriptions.json for every kind of link,
        # keyed by contentId, so this is the same edit whichever file the link is in
        jq --arg ID "$LINK_ID" --arg S "$NEW_SUMMARY" \
          '.descriptions[$ID] = ((.descriptions[$ID] // {}) + {summary: $S})' \
          src/links/links_descriptions.json | sponge src/links/links_descriptions.json
        echo "✅ Summary updated for LINK_ID '$LINK_ID'"

    - name: "Case: Editing a link in place (OTHER or UNOFFICIAL)"
      if: env.ACTION == 'edit_direct' && (env.NEW_TITLE != '' || env.NEW_LINK != '')
      run: |
        set -o pipefail
        jq -r --arg id "$LINK_ID" \
           --arg NEW_TITLE "$NEW_TITLE" \
           --arg NEW_LINK "$NEW_LINK" \
           --arg KEY "$TARGET_KEY" \
           '.[$KEY] |= map( if .contentId == $id then
               (if $NEW_TITLE != "" then .title = $NEW_TITLE else . end) |
               (if $NEW_LINK != "" then .link = $NEW_LINK else . end)
             else . end )' "$TARGET_FILE" | sponge "$TARGET_FILE"

        echo "✅ Updated $TARGET_FILE for LINK_ID '$LINK_ID'"

    - name: "Case: Overriding an AF Portal link in links_af.json via links_override.json"
      if: env.ACTION == 'override' && (env.NEW_TITLE != '' || env.NEW_LINK != '')
      run: |
        set -o pipefail
        OVERRIDE_ID=$(uuidgen)

        # Build override entry, only including title/link if provided
        OVERRIDE_ENTRY=$(jq -n \
          --arg OVERRIDE_ID "$OVERRIDE_ID" \
          --arg LINK_ID "$LINK_ID" \
          --arg NEW_TITLE "$NEW_TITLE" \
          --arg NEW_LINK "$NEW_LINK" \
          '{
            "id": $OVERRIDE_ID,
            "match_method": "Content ID",
            "match": $LINK_ID,
            "timestamp": now
          } |
          if ($NEW_TITLE != "") then .title = $NEW_TITLE else . end |
          if ($NEW_LINK != "") then .link = $NEW_LINK else . end'
        )

        # Append to links_override.json
        jq --argjson ENTRY "$OVERRIDE_ENTRY" '. += [$ENTRY]' src/links/links_override.json | sponge src/links/links_override.json

        echo "✅ Override added to links_override.json"

    - name: Trust check
      id: trust
      run: node scripts/check-trust.js

    - name: Warn on non-official domains
      if: fromJSON(steps.trust.outputs.findings || '0') > 0
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          await github.rest.issues.createComment({
            issue_number: context.payload.client_payload.original_issue,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: fs.readFileSync('/tmp/trust_warning.md', 'utf8'),
          });

    - name: Reputation scan
      id: reputation
      if: env.NEW_LINK != ''
      # A scan outage must not block the submission; the weekly run retries
      continue-on-error: true
      env:
        SAFE_BROWSING_KEY: ${{ secrets.SAFE_BROWSING_KEY }}
        VT_API_KEY: ${{ secrets.VT_API_KEY }}
        SCAN_URL: ${{ env.NEW_LINK }}
      run: node scripts/scan-reputation.js

    - name: Warn on flagged link
      if: fromJSON(steps.reputation.outputs.findings || '0') > 0
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          await github.rest.issues.createComment({
            issue_number: context.payload.client_payload.original_issue,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: fs.readFileSync('/tmp/reputation_warning.md', 'utf8'),
          });

    - name: Commit New Changes
      uses: EndBug/add-and-commit@v10
      with:
        message: "Override or update link from issue ${{ github.event.client_payload.original_issue }}"

    - name: Trigger next workflow
      uses: actions/github-script@v9
      with:
        script: |
          await github.rest.repos.createDispatchEvent({
            owner: context.repo.owner,
            repo: context.repo.repo,
            event_type: 'build',
            client_payload: {
              commit_sha: context.sha,
              message: 'Updated links from Issue'
            }
          });

    - name: Add success comment
      uses: actions/github-script@v9
      env:
        LINK_ID: ${{ env.LINK_ID }}
        NEW_TITLE: ${{ env.NEW_TITLE }}
        NEW_LINK: ${{ env.NEW_LINK }}
        NEW_SUMMARY: ${{ env.NEW_SUMMARY }}
      with:
        script: |
          const e = process.env;
          await github.rest.issues.createComment({
            issue_number: context.payload.client_payload.original_issue,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ **Link updated successfully!**\n\n' +
              'The link "' + e.LINK_ID + '" has been updated and will be active on the next site deployment.\n\n' +
              '**Update Details:**\n' +
              '- Link ID: ' + e.LINK_ID + '\n' +
              '- New Title: ' + e.NEW_TITLE + '\n' +
              '- New URL: ' + e.NEW_LINK + '\n' +
              '- New Summary: ' + e.NEW_SUMMARY
          })
