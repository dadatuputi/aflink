name: Link Add from Issue

on:
  repository_dispatch:
    types: [link_add]
  
jobs:
  add_link:
    runs-on: ubuntu-latest
    steps:

    - name: parse_fields
      env:
        BODY: ${{ github.event.client_payload.issue_body }}
      run: |

        echo "Original issue: ${{ github.event.client_payload.original_issue }}"
        echo "Triggered by: ${{ github.event.client_payload.triggered_by }}"
        echo "Issue body: ${{ github.event.client_payload.issue_body }}"

        # Extract the first non-blank line after a "### <header>" line, trimmed.
        # Anchoring on the header (rather than sed line numbers) survives blank-line
        # shifts, CRLF payloads, and leading/trailing whitespace; avoiding xargs
        # survives values containing quotes/apostrophes.
        field() {
          printf '%s' "$BODY" | awk -v H="### $1" '
            index($0, H) == 1 { found = 1; next }
            found && $0 ~ /[^[:space:]]/ {
              sub(/^[[:space:]]+/, ""); sub(/[[:space:]]+$/, ""); print; exit
            }'
        }

        TITLE=$(field "Link Title")
        URL=$(field "Link URL")
        LINK_TYPE=$(field "Link Type")
        SUMMARY=$(field "Summary")
        DESCRIPTION=$(field "Description")
        [[ -z "$TITLE" ]] && { echo "Missing Link Title"; exit 1; }
        [[ -z "$URL" ]] && { echo "Missing Link URL"; exit 1; }
        # Issues predating the Link Type dropdown have no such field: official
        [[ "$LINK_TYPE" == "Unofficial" ]] || LINK_TYPE="Official"
        # Blank optional form fields arrive as the literal "_No response_"
        [[ "$DESCRIPTION" == "_No response_" ]] && DESCRIPTION=""
        [[ "$SUMMARY" == "_No response_" ]] && SUMMARY=""

        # Every link shows a one-line summary; a later step comments the
        # error back on the issue and fails the job
        if [[ -z "$SUMMARY" ]]; then
          echo "VALIDATION_ERROR=no Summary was provided; every link needs a one-line summary of 90 characters or fewer" >> $GITHUB_ENV
        elif (( ${#SUMMARY} > 90 )); then
          echo "VALIDATION_ERROR=the Summary is ${#SUMMARY} characters; keep it to 90 or fewer" >> $GITHUB_ENV
        fi

        {
          echo "TITLE=$TITLE"
          echo "URL=$URL"
          echo "LINK_TYPE=$LINK_TYPE"
          echo "SUMMARY=$SUMMARY"
          echo "DESCRIPTION=$DESCRIPTION"
        } >> "$GITHUB_ENV"
        echo "Parsed TITLE=$TITLE"
        echo "Parsed URL=$URL"
        echo "Parsed LINK_TYPE=$LINK_TYPE"
        echo "Parsed SUMMARY=$SUMMARY"

    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        # Skip installing pacakge docs {makes the man-db trigger much faster) 
        # disabled `/doc` and `/info` as well to speed up apt operations further
        sudo tee /etc/dpkg/dpkg.cfg.d/01_nodoc > /dev/null << 'EOF'
        path-exclude /usr/share/doc/*
        path-exclude /usr/share/man/*
        path-exclude /usr/share/info/*
        EOF

        sudo apt-get update
        sudo apt-get install --yes jq moreutils uuid-runtime

    - name: Fail on validation error
      if: env.VALIDATION_ERROR != ''
      uses: actions/github-script@v9
      with:
        script: |
          await github.rest.issues.createComment({
            issue_number: context.payload.client_payload.original_issue,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `❌ Failed to add link: ${{ env.VALIDATION_ERROR }}. Please edit the issue so the link can be added.`
          });
          throw new Error('Validation error: ${{ env.VALIDATION_ERROR }}');

    - name: Add link to end of list with an auto-generated contentId
      env:
        SUMMARY: ${{ env.SUMMARY }}
        DESCRIPTION: ${{ env.DESCRIPTION }}
      run: |
        UUID=$(uuidgen)
        if [[ "${{ env.LINK_TYPE }}" == "Unofficial" ]]; then
          TARGET=src/links/links_unofficial.json
          KEY=UNOFFICIAL
        else
          TARGET=src/links/links_other.json
          KEY=OTHER
        fi
        jq -r --arg TITLE "${{ env.TITLE }}" --arg URL "${{ env.URL }}" --arg CONTENTID "$UUID" --arg KEY "$KEY" '.[$KEY] += [{"title": $TITLE, "link": $URL, "contentId": $CONTENTID}]' "$TARGET" | sponge "$TARGET"
        cat "$TARGET"
        # The summary and description live beside the link, keyed by its contentId
        jq --arg ID "$UUID" --arg S "$SUMMARY" --arg D "$DESCRIPTION" \
          '.descriptions[$ID] = ({summary: $S} + (if $D != "" then {description: $D} else {} end))' \
          src/links/links_descriptions.json | sponge src/links/links_descriptions.json

    - name: Trust check
      id: trust
      run: node scripts/check-trust.js

    - name: Warn on non-official domains
      if: fromJSON(steps.trust.outputs.findings || '0') > 0
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          await github.rest.issues.createComment({
            issue_number: context.payload.client_payload.original_issue,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: fs.readFileSync('/tmp/trust_warning.md', 'utf8'),
          });

    - name: Reputation scan
      id: reputation
      if: env.URL != ''
      # A scan outage must not block the submission; the weekly run retries
      continue-on-error: true
      env:
        SAFE_BROWSING_KEY: ${{ secrets.SAFE_BROWSING_KEY }}
        VT_API_KEY: ${{ secrets.VT_API_KEY }}
        SCAN_URL: ${{ env.URL }}
      run: node scripts/scan-reputation.js

    - name: Warn on flagged link
      if: fromJSON(steps.reputation.outputs.findings || '0') > 0
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          await github.rest.issues.createComment({
            issue_number: context.payload.client_payload.original_issue,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: fs.readFileSync('/tmp/reputation_warning.md', 'utf8'),
          });

    - name: Commit New Changes
      uses: EndBug/add-and-commit@v10
      with:
        message: "Added ${{ env.LINK_TYPE }} link from issue: ${{ env.TITLE }}"

    - name: Trigger next workflow
      uses: actions/github-script@v9
      with:
        script: |
          await github.rest.repos.createDispatchEvent({
            owner: context.repo.owner,
            repo: context.repo.repo,
            event_type: 'build',
            client_payload: {
              commit_sha: context.sha,
              message: 'Updated links from Issue'
            }
          });

    - name: Add success comment
      uses: actions/github-script@v9
      with:
        script: |
          await github.rest.issues.createComment({
            issue_number: context.payload.client_payload.original_issue,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `✅ **Link added successfully!** 
            
            The link has been added and will be active on the next site deployment.`
          })
