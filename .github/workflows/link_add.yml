name: Link Add from Issue

on:
  repository_dispatch:
    types: [link_add]
  
jobs:
  add_link:
    runs-on: ubuntu-latest
    steps:

    - name: parse_fields
      env:
        BODY: ${{ github.event.client_payload.issue_body }}
      run: |

        echo "Original issue: ${{ github.event.client_payload.original_issue }}"
        echo "Triggered by: ${{ github.event.client_payload.triggered_by }}"
        echo "Issue body: ${{ github.event.client_payload.issue_body }}"

        # Extract the first non-blank line after a "### <header>" line, trimmed.
        # Anchoring on the header (rather than sed line numbers) survives blank-line
        # shifts, CRLF payloads, and leading/trailing whitespace; avoiding xargs
        # survives values containing quotes/apostrophes.
        field() {
          printf '%s' "$BODY" | awk -v H="### $1" '
            index($0, H) == 1 { found = 1; next }
            found && $0 ~ /[^[:space:]]/ {
              sub(/^[[:space:]]+/, ""); sub(/[[:space:]]+$/, ""); print; exit
            }'
        }

        TITLE=$(field "Link Title")
        URL=$(field "Link URL")
        [[ -z "$TITLE" ]] && { echo "Missing Link Title"; exit 1; }
        [[ -z "$URL" ]] && { echo "Missing Link URL"; exit 1; }

        {
          echo "TITLE=$TITLE"
          echo "URL=$URL"
        } >> "$GITHUB_ENV"
        echo "Parsed TITLE=$TITLE"
        echo "Parsed URL=$URL"

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        # Skip installing pacakge docs {makes the man-db trigger much faster) 
        # disabled `/doc` and `/info` as well to speed up apt operations further
        sudo tee /etc/dpkg/dpkg.cfg.d/01_nodoc > /dev/null << 'EOF'
        path-exclude /usr/share/doc/*
        path-exclude /usr/share/man/*
        path-exclude /usr/share/info/*
        EOF

        sudo apt-get update
        sudo apt-get install --yes jq moreutils uuid-runtime

    - name: Add link to end of list with an auto-generated contentId
      run: |
        UUID=$(uuidgen)
        jq -r --arg TITLE "${{ env.TITLE }}" --arg URL "${{ env.URL }}" --arg CONTENTID "$UUID" '.OTHER += [{"title": $TITLE, "link": $URL, "contentId": $CONTENTID}]' src/links/links_other.json | sponge src/links/links_other.json
        cat src/links/links_other.json

    - name: Commit New Changes
      uses: EndBug/add-and-commit@v7
      with:
        message: "Added link from issue: ${{ env.TITLE }}"

    - name: Trigger next workflow
      uses: actions/github-script@v6
      with:
        script: |
          await github.rest.repos.createDispatchEvent({
            owner: context.repo.owner,
            repo: context.repo.repo,
            event_type: 'build',
            client_payload: {
              commit_sha: context.sha,
              message: 'Updated links from Issue'
            }
          });

    - name: Add success comment
      uses: actions/github-script@v6
      with:
        script: |
          await github.rest.issues.createComment({
            issue_number: context.payload.client_payload.original_issue,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `✅ **Link added successfully!** 
            
            The link has been added and will be active on the next site deployment.`
          })
