name: Tutorial Screenshots

# Re-captures the browser screenshots in src/tutorial.pug on a real Windows
# desktop, in light and dark mode, plus the README demo GIF, and commits them. See scripts/tutorial-screenshots/capture.py.

on:
  workflow_dispatch:
    inputs:
      site:
        description: Site to capture
        default: https://aflink.us
      only:
        description: What to capture (comma-separated)
        default: chrome,edge,firefox,demo
  # TEMPORARY: lets this branch's pushes run it, since a workflow can only be
  # dispatched once it is on the default branch; remove before merging
  push:
    branches: ["claude/festive-faraday-ty4dtn"]
    paths: ["scripts/tutorial-screenshots/**"]

permissions:
  contents: write
  actions: write   # to start the site build: pushes made here don't trigger it

concurrency:
  group: tutorial-screenshots-${{ github.ref }}

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install -r scripts/tutorial-screenshots/requirements.txt
          python -m playwright install firefox
      - name: Set display resolution
        continue-on-error: true
        shell: pwsh
        run: Set-DisplayResolution -Width 1280 -Height 800 -Force
      - name: Capture
        env:
          SITE: ${{ inputs.site || 'https://aflink.us' }}
          ONLY: ${{ inputs.only || 'chrome,edge,firefox,demo' }}
        run: python scripts/tutorial-screenshots/capture.py --site "$env:SITE" --only "$env:ONLY" --debug tutorial-debug
      - name: Upload debug output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tutorial-debug
          path: tutorial-debug
      - name: Commit screenshots
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add src/includes/img .github/demo.gif
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update tutorial screenshots"
          git push
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            gh workflow run build.yml --ref "${{ github.ref_name }}"
          fi
