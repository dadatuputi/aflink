name: Route Issue Closure Workflows - Authenticated

on:
  issues:
    types: [closed]

jobs:

  check_authorization:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'workflow')
    steps:

    - name: Check closure reason
      id: check
      uses: actions/github-script@v9
      with:
        script: |
          const stateReason = context.payload.issue.state_reason;
          const notPlanned = stateReason === 'not_planned';
          core.setOutput('state-reason', stateReason);
          core.setOutput('is-not-planned', notPlanned);

          if (notPlanned) {
            core.notice('Issue closed as "Not Planned" - workflow will halt');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚫 **Action not taken** - This issue was closed as "not planned". No further action will be taken.`
            });

          } else {
            core.notice(`Issue closed as ${stateReason || 'completed'} - workflow will continue`);
          }

    - name: Check authorization
      id: auth
      if: steps.check.outputs.is-not-planned == 'false'
      uses: actions/github-script@v9
      with:
        script: |
          const { data: collaborators } = await github.rest.repos.listCollaborators({
            owner: context.repo.owner,
            repo: context.repo.repo,
            permission: 'push'
          });

          const authorizedUsers = collaborators.map(user => user.login);
          const currentUser = context.payload.sender.login;
          const isAuthorized = authorizedUsers.includes(currentUser);

          core.setOutput('authorized', isAuthorized);
          core.setOutput('user', currentUser);
          core.setOutput('authorized-users', authorizedUsers.join(','));

          if (isAuthorized) {
            core.notice(`User ${currentUser} is authorized - workflow will continue`);
          } else {
            core.notice(`User ${currentUser} is unauthorized - workflow will halt`);

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚫 **Action not taken** - This issue was closed by @${currentUser} but only authorized users can approve link requests.

              If this action should still be taken, please have an authorized user review and close this issue.`
            });
          }

          return isAuthorized;

    - name: Dispatch the workflow for the issue's label
      if: steps.auth.outputs.authorized == 'true'
      env:
        BODY: ${{ github.event.issue.body }}
      uses: actions/github-script@v9
      with:
        script: |
          // One request type per issue: the first label with a workflow wins,
          // so an issue carrying two never starts two runs that race to commit
          const events = {
            'add link': 'link_add',
            'override link': 'link_override',
            'update af links': 'link_update_af',
            'delete link': 'link_delete',
          };
          const labels = context.payload.issue.labels.map(l => l.name);
          const label = Object.keys(events).find(l => labels.includes(l));
          if (!label) {
            core.notice('No link request label on this issue; nothing to dispatch');
            return;
          }
          await github.rest.repos.createDispatchEvent({
            owner: context.repo.owner,
            repo: context.repo.repo,
            event_type: events[label],
            client_payload: {
              original_issue: context.issue.number,
              issue_body: process.env.BODY,
              triggered_by: context.actor
            }
          });
          core.notice(`Dispatched ${events[label]} for label "${label}"`);
