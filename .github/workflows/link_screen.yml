name: Link Request Safety Check

# Scans the URL in a new Add a Link or Override request as soon as the issue
# is opened (or its body edited) and always reports back on the issue: safe,
# unsafe, official domain, or not a URL. Gives the approver a verdict before
# closing; link_add/link_override scan again at approval in case it changed.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  screen:
    runs-on: ubuntu-latest
    # Edits only matter when the body (and so maybe the URL) changed
    if: >-
      (contains(github.event.issue.labels.*.name, 'add link') ||
       contains(github.event.issue.labels.*.name, 'override link')) &&
      github.event.issue.state == 'open' &&
      (github.event.action == 'opened' || github.event.changes.body)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Read URL from the issue form
        id: url
        # The same parser the link workflows use (scripts/issue-fields.js)
        env:
          BODY: ${{ github.event.issue.body }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          if [[ ",$LABELS," == *",add link,"* ]]; then
            node scripts/issue-fields.js --output url="Link URL"
          else
            node scripts/issue-fields.js --output url="New Link URL"
          fi

      - name: Reputation scan
        id: scan
        if: steps.url.outputs.url != ''
        continue-on-error: true
        env:
          SAFE_BROWSING_KEY: ${{ secrets.SAFE_BROWSING_KEY }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          SCAN_URL: ${{ steps.url.outputs.url }}
        run: node scripts/scan-reputation.js

      - name: Report on the issue
        if: steps.url.outputs.url != ''
        uses: actions/github-script@v9
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          SCAN_URL: ${{ steps.url.outputs.url }}
        with:
          script: |
            const fs = require('fs');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Scan failed: point at the same report pages the script links, to check by hand
            const failed = () => {
              const url = process.env.SCAN_URL;
              let host = '';
              try { host = new URL(url).hostname; } catch {}
              const reports = [
                `[Google Safe Browsing](https://transparencyreport.google.com/safe-browsing/search?url=${encodeURIComponent(url)})`,
                ...(host ? [`[VirusTotal](https://www.virustotal.com/gui/domain/${encodeURIComponent(host)})`] : []),
              ];
              return '❔ **Link check: could not complete.** The reputation services did not answer, so this link has not been checked. ' +
                'It will be scanned again when the request is approved.\n\nCheck manually: ' + reports.join(' · ');
            };
            const body = process.env.OUTCOME === 'success'
              ? fs.readFileSync('/tmp/reputation_verdict.md', 'utf8')
              : failed();
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `${body}\n\n<sub>[Scan details](${run})</sub>`,
            });
