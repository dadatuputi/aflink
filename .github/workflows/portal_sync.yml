name: Portal Sync

# Started by the search worker's /submit endpoint when someone runs
# getlinks.js on an AF Portal page. Merges that page's links into
# links_af.json on the portal-sync branch and opens or updates one pull
# request for review; nothing reaches master without a merge. The Update AF
# Links issue form (link_update_af.yml) remains as the manual route.
on:
  workflow_dispatch:
    inputs:
      payload_id:
        description: Id of the packed payload the search worker stored (GET /submission/<id>)
        required: false
        default: ''
      payload:
        description: gzip + base64 of {pages, ...} from getlinks.js, for a payload small enough to pass inline
        required: false
        default: ''
      source:
        description: Portal page(s) the links came from, comma-separated (index:... or quicklinks:...)
        required: true
      digest:
        description: Short hash of the payload, for the commit message
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write

# One submission at a time, so two pages sent back to back both land on the branch
concurrency:
  group: portal-sync
  cancel-in-progress: false

env:
  BRANCH: portal-sync
  WORKER: https://aflink-autocomplete.aswang.workers.dev

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the build reads file dates from git log

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Decode submission
        env:
          PAYLOAD: ${{ inputs.payload }}
          PAYLOAD_ID: ${{ inputs.payload_id }}
          SOURCE: ${{ inputs.source }}
        run: |
          # The worker keeps the packed payload; dispatch inputs are too small for it
          if [[ -n "$PAYLOAD_ID" ]]; then
            [[ "$PAYLOAD_ID" =~ ^[0-9a-f]{32}$ ]] || { echo "Bad payload id"; exit 1; }
            PAYLOAD=$(curl -fsS "$WORKER/submission/$PAYLOAD_ID")
          fi
          [[ -n "$PAYLOAD" ]] || { echo "No payload"; exit 1; }
          printf '%s' "$PAYLOAD" | base64 -d | gzip -dc > /tmp/incoming.json
          # The sources the worker checked have to be the ones inside the payload
          FOUND=$(jq -r 'if .pages then ([.pages[].source] | join(",")) else .source end' /tmp/incoming.json)
          [[ "$FOUND" == "$SOURCE" ]] || { echo "Source mismatch: $FOUND vs $SOURCE"; exit 1; }
          echo "Decoded $(jq '[(if .pages then .pages[] else . end) | .afpCategorizedLinksDto.links[] | length] | add' /tmp/incoming.json) links from $SOURCE"

      - name: Switch to the sync branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin "$BRANCH" 2>/dev/null; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
            # Earlier submissions wait on this branch; bring master's changes
            # under them. A conflict means master changed the same links, so
            # start over from master and say so in the PR.
            if ! git merge --no-edit origin/master; then
              git merge --abort
              git checkout -B "$BRANCH" origin/master
              echo "RESET_NOTE=Earlier submissions on this branch conflicted with master and were dropped; resubmit those pages." >> $GITHUB_ENV
            fi
          else
            git checkout -b "$BRANCH" origin/master
          fi

      - name: Merge links
        run: |
          cp src/links/links_af.json /tmp/links_af_old.json
          node scripts/af-merge.js /tmp/links_af_old.json /tmp/incoming.json > src/links/links_af.json

      - name: Guard existing links
        id: guard
        run: node scripts/af-guard.js /tmp/links_af_old.json src/links/links_af.json | tee /tmp/guard.md

      - name: Open an issue for a rejected submission
        if: failure() && steps.guard.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Rejected portal sync from ${{ toJSON(inputs.source) }}`,
              body: fs.readFileSync('/tmp/guard.md', 'utf8') + `\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['workflow'],
              assignees: ['dadatuputi'],
            });

      - name: Compute import statistics
        id: stats
        run: |
          node scripts/af-import-stats.js /tmp/links_af_old.json src/links/links_af.json | tee /tmp/stats.txt
          if git diff --quiet -- src/links/links_af.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No change to links_af.json; nothing to sync." | tee -a $GITHUB_STEP_SUMMARY
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trust check
        if: steps.stats.outputs.changed == 'true'
        id: trust
        run: node scripts/check-trust.js | tee /tmp/trust.md

      - name: Build and test
        if: steps.stats.outputs.changed == 'true'
        # A pull request opened by the workflow token does not start the Test
        # workflow, so the same checks run here before anything is pushed.
        # New portal links have no hand-written summary yet: that rule holds
        # for the pull request, not for the sync, which lists them instead.
        env:
          AFLINK_SYNC: '1'
        run: |
          npm run dev:build && npm test
          node -e '
            const d = JSON.parse(require("fs").readFileSync("_site/links.json"));
            const missing = d.links.flatMap(c => c.links.filter(l => !l.isDeleted && !l.isDead && !l.summary).map(l => `- ${l.title} (${l.contentId})`));
            require("fs").writeFileSync("/tmp/missing.md", missing.length
              ? `### ${missing.length} new link(s) need a summary in src/links/links_descriptions.json before this merges\n\n${missing.join("\n")}\n`
              : "");
          '

      - name: Commit and push
        if: steps.stats.outputs.changed == 'true'
        env:
          SOURCE: ${{ inputs.source }}
          DIGEST: ${{ inputs.digest }}
        run: |
          git add src/links/links_af.json
          git commit -m "Portal sync from $SOURCE${DIGEST:+ ($DIGEST)}"
          git push --force-with-lease origin "$BRANCH"

      - name: Open or update the pull request
        if: steps.stats.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
        run: |
          {
            echo "### Submission from \`$SOURCE\`"
            echo
            echo '```'
            cat /tmp/stats.txt
            echo '```'
            echo
            cat /tmp/trust.md
            echo
            cat /tmp/missing.md
            if [[ -n "${RESET_NOTE:-}" ]]; then echo; echo "> $RESET_NOTE"; fi
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/comment.md
          cat /tmp/comment.md >> $GITHUB_STEP_SUMMARY

          NUMBER=$(gh pr list --head "$BRANCH" --base master --state open --json number --jq '.[0].number')
          if [[ -z "$NUMBER" ]]; then
            {
              echo "Links submitted from the AF Portal through getlinks.js, merged by scripts/af-merge.js."
              echo "Each submission is a commit on this branch and a comment below with what it changed."
              echo "Merging publishes them; closing discards them."
            } > /tmp/body.md
            gh pr create --base master --head "$BRANCH" --title "Portal sync" --body-file /tmp/body.md --assignee dadatuputi
          fi
          gh pr comment "$BRANCH" --body-file /tmp/comment.md
